<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primera Stereo - Radio Video Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f0a1f, #1a0033);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px 0;
    }
    .glass {
      background: rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .media-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>

  <div class="max-w-lg w-full mx-auto">

    <div class="flex items-center justify-center gap-4 mb-8">
      <img src="https://primerastereo.netlify.app/favicon.png" 
           alt="Logo" class="w-20 h-20 object-contain rounded-3xl shadow-xl">
      <div>
        <h1 class="text-5xl font-bold tracking-tighter text-white">PRIMERA STEREO</h1>
        <p class="text-blue-400 text-xl -mt-1">RADIO VIDEO ONLINE</p>
      </div>
    </div>

    <div class="glass rounded-3xl p-8 shadow-2xl">

      <!-- Media Container -->
      <div class="mb-6">
        <div id="media-container" class="media-container"></div>
      </div>

      <!-- Info -->
      <div class="text-center mb-6">
        <p class="text-emerald-400 text-sm font-medium">● EN VIVO</p>
        <h2 id="song-title" class="text-2xl font-bold text-white mt-2 min-h-[3rem]">Cargando canción...</h2>
        <p id="artist" class="text-gray-300 text-lg">Primera Stereo</p>
      </div>

      <!-- Visualizador -->
      <div class="mb-8 bg-black/50 rounded-2xl p-4">
        <canvas id="visualizer" width="700" height="80" class="w-full"></canvas>
      </div>

      <!-- Controles -->
      <div class="flex flex-col items-center gap-4">
        <button onclick="togglePlay()" id="play-btn"
          class="w-28 h-28 bg-gradient-to-br from-blue-600 via-purple-600 to-violet-600 rounded-full flex items-center justify-center text-6xl shadow-xl active:scale-95">
          <i class="fas fa-play" id="play-icon"></i>
        </button>

        <div class="flex items-center gap-3 w-48">
          <i class="fas fa-volume-up text-gray-400"></i>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" class="w-full accent-blue-500">
        </div>
      </div>

      <audio id="audio-player" class="hidden"></audio>
    </div>

    <footer class="text-center text-gray-500 text-xs mt-12">
      © 2026 Primera Stereo • Radio Video Online
    </footer>
  </div>

  <script>
    const API_KEY = "AIzaSyCqoBZiuGPXibmPuhpLbGZlBIcntSj2lDc";

    const audio = document.getElementById('audio-player');
    const mediaContainer = document.getElementById('media-container');
    const songTitle = document.getElementById('song-title');
    const artistEl = document.getElementById('artist');
    const volumeSlider = document.getElementById('volume');

    audio.src = "https://primerastereo.stream.laut.fm/primerastereo";
    const metadataUrl = "https://api.laut.fm/station/primerastereo/current_song";

    let isPlaying = false;

    volumeSlider.addEventListener('input', () => audio.volume = volumeSlider.value);

    function showLogo() {
      mediaContainer.innerHTML = `
        <img src="https://primerastereo.netlify.app/favicon.png" 
             class="w-full h-full object-contain p-10 bg-black" alt="Primera Stereo">
      `;
    }

    async function loadVideo(title, artist) {
      try {
        const query = encodeURIComponent(`${artist} ${title}`);
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${query}&type=video&maxResults=1&key=${API_KEY}`);
        const data = await res.json();

        if (data.items && data.items.length > 0) {
          const videoId = data.items[0].id.videoId;
          mediaContainer.innerHTML = `
            <iframe width="100%" height="100%" 
                    src="https://www.youtube.com/embed/${videoId}?autoplay=0&mute=1&modestbranding=1" 
                    frameborder="0" allowfullscreen></iframe>
          `;
          return;
        }
      } catch (e) {
        console.log("No se pudo cargar video");
      }
      showLogo();
    }

    async function updateMetadata() {
      try {
        const res = await fetch(metadataUrl);
        const data = await res.json();

        const title = data.title || "En Vivo";
        const artist = data.artist?.name || "Primera Stereo";

        songTitle.textContent = title;
        artistEl.textContent = artist;

        await loadVideo(title, artist);

      } catch (err) {
        console.error(err);
        showLogo();
      }
    }

    async function togglePlay() {
      if (!isPlaying) {
        await audio.play();
        isPlaying = true;
        document.getElementById('play-icon').classList.replace('fa-play', 'fa-pause');
        updateMetadata();
      } else {
        audio.pause();
        isPlaying = false;
        document.getElementById('play-icon').classList.replace('fa-pause', 'fa-play');
      }
    }

    // Actualizar cada 8 segundos
    setInterval(() => {
      if (isPlaying) updateMetadata();
    }, 8000);

    window.onload = () => {
      audio.volume = 0.8;
      showLogo();
    };
  </script>
</body>
</html>
