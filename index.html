<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRIMERA STEREO 📻 RADIO VIDEO ONLINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/ico" href="https://primerastereo.netlify.app/favicon.png" sizes="512x512">
    <style>
        :root { --primary-color: #1877F2; --bg-dark: #000000; --accent: #1877F2; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Ajuste para evitar scroll en móviles */
        body { 
            font-family: 'Outfit', sans-serif; 
            background: var(--bg-dark); 
            color: white; 
            height: 100vh; 
            height: 100dvh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }
        
        .bg-layer { position: absolute; top:0; left:0; width:100%; height:100%; background-size: cover; background-position: center; filter: blur(60px) brightness(0.2); z-index: -2; transition: 2s; }
        .bg-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0.9)); z-index: -1; }
        
        /* Menú Lateral */
        #menu-toggle { display: none; }
        .menu-btn { position: fixed; top: 10px; left: 10px; z-index: 1100; cursor: pointer; color: white; font-size: 20px; background: rgba(255,255,255,0.1); padding: 8px; border-radius: 8px; }
        .side-menu { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: rgba(10, 10, 10, 0.98); transition: 0.4s; z-index: 1050; padding: 20px; border-right: 1px solid var(--primary-color); overflow-y: auto; }
        #menu-toggle:checked + .side-menu { left: 0; }
        
        .btn-social { display: flex; align-items: center; padding: 10px 15px; margin-bottom: 6px; border-radius: 8px; text-decoration: none; color: white; font-size: 1rem; background: rgba(255,255,255,0.05); transition: 0.3s; }
        .btn-social i { margin-right: 12px; width: 22px; text-align: center; }
		/* Colores de Redes */
        .instagram i { color: #E1306C; }
        .facebook i  { color: #1877F2; }
        .whatsapp i  { color: #25D366; }
        .telegram i  { color: #0088CC; }
        .tiktok i    { color: #fff; }
        .soundcloud i { color: #ff8400; } /* Ajustado a color sólido para evitar degradados no pedidos */
        .youtube i   { color: #FF0000; }
        .x-twitter i { color: #FFFFFF; }
        .threads i   { color: #FFFFFF; }
        .app-store i { color: #A4C639; }
        /* Contenido Principal Responsivo */
        main { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 10; 
            text-align: center;
            padding: 10px;
        }

        .main-title { color: var(--accent); font-size: clamp(1.2rem, 5vw, 1.8rem); letter-spacing: 2px; }
        .sub-title { letter-spacing: 4px; opacity: 0.8; font-size: 0.7rem; margin-bottom: 5px; text-transform: uppercase; }
        
        /* Ajuste dinámico del tamaño del reproductor */
        .logo-container { 
            width: min(85vw, 325px); 
            height: min(80vw, 315px); 
            border-radius: 15px; 
            overflow: hidden; 
            position: relative; 
            box-shadow: 0 0 30px rgba(0,0,0,0.8); 
            background: #000; 
            margin-bottom: 10px; 
        }
        #video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #yt-player { width: 100%; height: 100%; border: none; transform: scale(1.8); pointer-events: none; opacity: 0; transition: 1s; }
        #album-art { width: 100%; height: 100%; object-fit: cover; position: relative; z-index: 2; transition: 1.5s; }

        .track-info { width: min(90vw, 340px); margin: 0 auto 5px; overflow: hidden; white-space: nowrap; }
        .marquee { display: inline-block; animation: marquee 15s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        #artist-name { font-size: 1.1rem; font-weight: 600; display: inline; }
        #song-title { color: var(--primary-color); font-size: 1.1rem; display: inline; margin-left: 20px; }

        /* Footer Compacto y Reducción de Espacios */
        footer { 
            padding: 5px 15px 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 100%;
        }
        
        .play-btn { width: 55px; height: 55px; border-radius: 50%; background: var(--primary-color); border: none; color: white; cursor: pointer; font-size: 1.2rem; margin-bottom: 5px; }
        #volume-slider { width: min(70vw, 220px); accent-color: var(--accent); margin-bottom: 5px; }

        .ads-container { width: min(90vw, 320px); text-align: center; margin-top: 2px; }
        .ads-title { color: var(--accent); font-size: 0.55rem; font-weight: bold; letter-spacing: 2px; margin-bottom: 3px; }
        #ad-link img { width: 100%; height: clamp(50px, 10vh, 70px); object-fit: contain; transition: opacity 0.8s; }

        .copyright { font-size: 0.6rem; opacity: 0.7; margin-top: 5px; text-align: center; }

        /* Media Queries para pantallas muy pequeñas */
        @media (max-height: 600px) {
            .logo-container { width: 220px; height: 210px; }
            .main-title { font-size: 1.1rem; }
            .play-btn { width: 45px; height: 45px; }
        }
    </style>
</head>
<body>
    <div class="bg-layer" id="bg-layer"></div>
    <div class="bg-overlay"></div>
    
    <label for="menu-toggle" class="menu-btn"><i class="fas fa-bars"></i></label>
    <input type="checkbox" id="menu-toggle">

    <aside class="side-menu">
        <h3 style="color:var(--accent); margin-bottom:15px; padding-left:40px;">Síguenos</h3>
        <a href="https://www.instagram.com/Primera.Stereo/" target="_blank" class="btn-social instagram"><i class="fab fa-instagram"></i> Instagram</a>
        <a href="https://www.facebook.com/PrimeraStereoRadio" target="_blank" class="btn-social facebook"><i class="fab fa-facebook-f"></i> Facebook</a>
        <a href="https://api.whatsapp.com/send?phone=+5804127097429&text=Hola%20estoy%20escuchando%20la%20radio" target="_blank" class="btn-social whatsapp"><i class="fab fa-whatsapp"></i> Whatsapp</a>
        <a href="https://t.me/PrimeraStereo" target="_blank" class="btn-social telegram"><i class="fab fa-telegram-plane"></i> Telegram</a>
        <a href="https://www.tiktok.com/@primerastereo" target="_blank" class="btn-social tiktok"><i class="fab fa-tiktok"></i> Tiktok</a>
        <a href="https://soundcloud.com/primerastereo" target="_blank" class="btn-social soundcloud"><i class="fab fa-soundcloud"></i> Soundcloud</a>
        <a href="https://www.youtube.com/@primerastereo" target="_blank" class="btn-social youtube"><i class="fab fa-youtube"></i> Youtube</a>
        <a href="https://x.com/Primera_Stereo" target="_blank" class="btn-social x-twitter"><i class="fab fa-x-twitter"></i> Twitter / X</a>
        <a href="https://www.threads.net/@primera.stereo" target="_blank" class="btn-social threads"><i class="fas fa-at"></i> Threads</a>
        <a href="https://www.appcreator24.com/app3819260-6rbmq8" target="_blank" class="btn-social app-store"><i class="fab fa-google-play"></i> Descargar App</a>
    </aside>

    <main>
        <h1 class="main-title">PRIMERA STEREO</h1>
        <p class="sub-title">Radio Video Online</p>
        <div class="logo-container">
            <div id="video-container"><div id="yt-player"></div></div>
            <img src="https://primerastereo.netlify.app/favicon.png" id="album-art">
        </div>
        <div class="track-info">
            <div class="marquee">
                <span id="artist-name">PRIMERA STEREO</span>
                <span id="song-title">Iniciando...</span>
            </div>
        </div>
    </main>

    <footer>
        <button id="play-btn" class="play-btn"><i class="fas fa-play"></i></button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8">
        
        <div class="ads-container">
            <p class="ads-title">NUESTROS PATROCINANTES</p>
            <a id="ad-link" href="#" target="_blank">
                <img id="ad-banner" src="https://primerastereo.netlify.app/disponible2.jpg">
            </a>
        </div>
        <p class="copyright">© 2010 - 2026 PRIMERA STEREO<br>RADIO VIDEO ONLINE</p>
    </footer>

    <audio id="audio-player" src="https://primerastereo.stream.laut.fm/primerastereo" crossorigin="anonymous"></audio>

    <script>
        const art = document.getElementById('album-art');
        const bg = document.getElementById('bg-layer');
        const audio = document.getElementById('audio-player');
        let player, errorYoutube = false;

        const banners = [
            { img: "https://primerastereo.netlify.app/disponible2.jpg", link: "https://api.whatsapp.com/send?phone=+5804127097429" },
            { img: "https://primerastereo.netlify.app/Alvacom%20Systems.jpg", link: "https://www.facebook.com/AlvacomSystems" },
            { img: "https://primerastereo.netlify.app/KINESIOLOGIA2.gif", link: "https://www.instagram.com/nely_alvarez" },
            { img: "https://primerastereo.netlify.app/En3D%20Venezuela%20Banner.png", link: "http://www.en3d.io" },
            { img: "https://primerastereo.netlify.app/disponible1.jpg", link: "https://api.whatsapp.com/send?phone=+5804127097429" }
        ];
        let bIdx = 0;

        function rotateBanners() {
            const bannerImg = document.getElementById('ad-banner');
            bannerImg.style.opacity = 0;
            setTimeout(() => {
                bannerImg.src = banners[bIdx].img;
                document.getElementById('ad-link').href = banners[bIdx].link;
                bannerImg.style.opacity = 1;
                bIdx = (bIdx + 1) % banners.length;
            }, 800);
        }

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '100%', width: '100%',
                playerVars: { 'autoplay': 1, 'mute': 1, 'controls': 0, 'modestbranding': 1, 'rel': 0 },
                events: { 'onError': () => { errorYoutube = true; art.style.opacity = "1"; } }
            });
        }

        async function updateSong() {
            try {
                const res = await fetch('https://api.laut.fm/station/primerastereo/current_song');
                const data = await res.json();
                const artist = data.artist.name;
                const title = data.title;

                if (document.getElementById('song-title').innerText !== title) {
                    document.getElementById('artist-name').innerText = artist;
                    document.getElementById('song-title').innerText = title;

                    const itunes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(artist + " " + title)}&entity=song&limit=1`);
                    const iData = await itunes.json();
                    let img = (iData.results.length > 0) ? iData.results[0].artworkUrl100.replace('100x100', '600x600') : 'https://primerastereo.netlify.app/favicon.png';
                    art.src = img; bg.style.backgroundImage = `url('${img}')`;

                    if(player && player.loadVideoById) {
                        const query = encodeURIComponent(artist + " " + title + " official video");
                        fetch(`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent('https://www.youtube.com/results?search_query=' + query)}`)
                        .then(r => r.text()).then(html => {
                            const id = html.match(/"videoId":"([^"]+)"/);
                            if (id && id[1]) {
                                player.loadVideoById({ videoId: id[1] });
                                player.mute();
                                setTimeout(() => { if(!errorYoutube) art.style.opacity = "0"; document.getElementById('yt-player').style.opacity = "1"; }, 4000);
                            } else {
                                art.style.opacity = "1";
                                document.getElementById('yt-player').style.opacity = "0";
                            }
                        });
                    }
                }
            } catch (e) {}
        }

        document.getElementById('play-btn').onclick = () => {
            if (audio.paused) { audio.play(); document.getElementById('play-btn').innerHTML = '<i class="fas fa-pause"></i>'; }
            else { audio.pause(); document.getElementById('play-btn').innerHTML = '<i class="fas fa-play"></i>'; }
        };

        document.getElementById('volume-slider').oninput = (e) => audio.volume = e.target.value;

        setInterval(updateSong, 15000);
        setInterval(rotateBanners, 15000); 
        updateSong();
        rotateBanners();
    </script>
</body>
</html>
