<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primera Stereo - Radio Video Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f0a1f, #1a0033);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px 0;
    }
    .glass {
      background: rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .media-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>

  <div class="max-w-lg w-full mx-auto">

    <!-- Header -->
    <div class="flex items-center justify-center gap-4 mb-8">
      <img src="https://primerastereo.netlify.app/favicon.png" 
           alt="Logo Primera Stereo" class="w-20 h-20 object-contain rounded-3xl shadow-xl">
      <div>
        <h1 class="text-5xl font-bold tracking-tighter text-center text-white">PRIMERA STEREO</h1>
        <p class="text-blue-400 text-xl text-center -mt-1">RADIO VIDEO ONLINE</p>
      </div>
    </div>

    <!-- Reproductor -->
    <div class="glass rounded-3xl p-8 shadow-2xl">

      <!-- Área de Video / Logo -->
      <div class="mb-6">
        <div id="media-container" class="media-container">
          <img id="station-logo" src="https://primerastereo.netlify.app/favicon.png" 
               alt="Primera Stereo" class="w-full h-full object-contain p-8 bg-black">
        </div>
      </div>

      <!-- Info de la canción -->
      <div class="text-center mb-6">
        <p class="uppercase tracking-widest text-emerald-400 text-sm font-medium">● EN VIVO</p>
        <h2 id="song-title" class="text-2xl font-bold mt-2 min-h-[3.2rem] text-white">Cargando canción...</h2>
        <p id="artist" class="text-gray-200 text-lg font-medium">Primera Stereo</p>
      </div>

      <!-- Visualizador -->
      <div class="mb-6 bg-black/50 rounded-2xl p-4">
        <canvas id="visualizer" width="700" height="80" class="w-full"></canvas>
      </div>

      <!-- Controles -->
      <div class="flex flex-col items-center gap-4">
        <button onclick="togglePlay()" 
                id="play-btn"
                class="w-28 h-28 bg-gradient-to-br from-blue-600 via-purple-600 to-violet-600 hover:brightness-110 transition-all rounded-full flex items-center justify-center text-6xl shadow-2xl shadow-purple-500/70 active:scale-95">
          <i class="fas fa-play" id="play-icon"></i>
        </button>

        <!-- Volumen -->
        <div class="flex items-center gap-3 w-full max-w-[220px]">
          <i class="fas fa-volume-up text-gray-400"></i>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" class="w-full accent-blue-500">
        </div>
      </div>

      <audio id="audio-player" class="hidden" crossorigin="anonymous"></audio>
    </div>

    <!-- Redes Sociales -->
    <div class="flex justify-center gap-8 mt-10 text-4xl text-gray-400">
      <a href="#" target="_blank" class="hover:text-blue-400 transition"><i class="fab fa-facebook"></i></a>
      <a href="#" target="_blank" class="hover:text-pink-500 transition"><i class="fab fa-instagram"></i></a>
      <a href="#" target="_blank" class="hover:text-white transition"><i class="fa-brands fa-x-twitter"></i></a>
      <a href="#" target="_blank" class="hover:text-red-500 transition"><i class="fab fa-youtube"></i></a>
      <a href="#" target="_blank" class="hover:text-green-500 transition"><i class="fab fa-whatsapp"></i></a>
    </div>

    <footer class="text-center text-gray-500 text-xs mt-12">
      © 2026 Primera Stereo • Radio Video Online
    </footer>
  </div>

  <script>
    const API_KEY = "AIzaSyCqoBZiuGPXibmPuhpLbGZlBIcntSj2lDc";   // ← Tu clave

    const audio = document.getElementById('audio-player');
    const mediaContainer = document.getElementById('media-container');
    const songTitleEl = document.getElementById('song-title');
    const artistEl = document.getElementById('artist');
    const volumeSlider = document.getElementById('volume-slider');

    audio.src = "https://primerastereo.stream.laut.fm/primerastereo";
    const metadataUrl = "https://api.laut.fm/station/primerastereo/current_song";

    let isPlaying = false;
    let player = null;

    volumeSlider.addEventListener('input', () => {
      audio.volume = parseFloat(volumeSlider.value);
    });

    function showStationLogo() {
      mediaContainer.innerHTML = `
        <img src="https://primerastereo.netlify.app/favicon.png" 
             alt="Primera Stereo" class="w-full h-full object-contain p-12 bg-black">
      `;
    }

    async function searchYouTubeVideo(title, artist) {
      try {
        const query = encodeURIComponent(`${artist} ${title}`);
        const response = await fetch(
          `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${query}&type=video&maxResults=3&key=${API_KEY}`
        );
        const data = await response.json();

        if (data.items && data.items.length > 0) {
          const videoId = data.items[0].id.videoId;
          loadYouTubeVideo(videoId);
          return true;
        }
      } catch (error) {
        console.log("Error buscando video:", error);
      }
      showStationLogo();
      return false;
    }

    function loadYouTubeVideo(videoId) {
      mediaContainer.innerHTML = `
        <iframe width="100%" height="100%" 
                src="https://www.youtube.com/embed/${videoId}?autoplay=0&modestbranding=1" 
                frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
        </iframe>
      `;
    }

    async function updateMetadata() {
      try {
        const res = await fetch(metadataUrl);
        const data = await res.json();

        const title = data.title || "En Vivo";
        const artist = data.artist?.name || "Primera Stereo";

        songTitleEl.textContent = title;
        artistEl.textContent = artist;

        // Buscar video
        await searchYouTubeVideo(title, artist);

      } catch (e) {
        console.error(e);
        showStationLogo();
      }
    }

    async function togglePlay() {
      if (!isPlaying) {
        try {
          await audio.play();
          isPlaying = true;
          document.getElementById('play-icon').classList.replace('fa-play', 'fa-pause');
          updateMetadata();
        } catch (err) {
          alert("No se pudo reproducir el audio.");
        }
      } else {
        audio.pause();
        isPlaying = false;
        document.getElementById('play-icon').classList.replace('fa-pause', 'fa-play');
      }
    }

    // Actualizar metadatos cada 10 segundos
    setInterval(() => {
      if (isPlaying) updateMetadata();
    }, 10000);

    window.onload = () => {
      audio.volume = 0.8;
      updateMetadata();
    };
  </script>
</body>
</html>
